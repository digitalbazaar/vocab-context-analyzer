vocab:
  id: ex
  value: https://example.org/v#
  context: https://example.org/v.context.jsonld

ontology:
  - property: dc:title
    value: Coercion Example Vocabulary
  - property: dc:description
    value: >-
      A vocabulary whose object property has a node range, mapped with @id
      coercion in its context.

class:
  - id: Person
    label: Person
    comment: A human being.

property:
  - id: knows
    label: knows
    domain: Person
    range: Person
    comment: A Person this Person knows (an object property; coerced to @id).
